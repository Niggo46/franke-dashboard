<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Franke · Campaign Performance Dashboard</title>
<script src="chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --border: #e5e7eb;
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --success: #059669;
    --warning: #d97706;
    --danger: #dc2626;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    color: #fff;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-logo {
    width: 42px; height: 42px;
    border-radius: 8px;
    object-fit: contain;
    background: #fff;
    padding: 2px;
    flex-shrink: 0;
  }
  .header-title h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header-title p { font-size: 13px; color: #94a3b8; margin-top: 1px; }
  .header-meta {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 13px;
    color: #94a3b8;
  }
  .header-meta span { display: flex; align-items: center; gap: 6px; }
  .fx-rate {
    background: rgba(37, 99, 235, 0.2);
    border: 1px solid rgba(37, 99, 235, 0.35);
    color: #93c5fd;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .refresh-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e2e8f0;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.18); }

  /* Container */
  .container { max-width: 1280px; margin: 0 auto; padding: 24px 24px 40px; }

  /* Platform Tabs */
  .tabs {
    display: flex; gap: 4px;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    width: fit-content;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all 0.2s;
    border: none;
    background: none;
  }
  .tab.active {
    background: var(--primary);
    color: #fff;
  }
  .tab:hover:not(.active) { color: var(--text); background: #f3f4f6; }
  /* Date filter bar */
  .filter-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 10px 16px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    width: fit-content;
    max-width: 100%;
  }
  .filter-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.5px; }
  .filter-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
  .range-pill {
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: #fff; color: var(--text-secondary); font-size: 13px; cursor: pointer;
    transition: all 0.15s;
  }
  .range-pill:hover { border-color: var(--primary); color: var(--primary); }
  .range-pill.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .date-sep { font-size: 12px; color: var(--text-secondary); }
  .date-input {
    padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 13px; color: var(--text); background: #fff;
    font-family: inherit; outline: none; transition: all 0.15s; color-scheme: light;
  }
  .date-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .date-input.active { border-color: var(--primary); color: var(--primary); font-weight: 600; background: var(--primary-light); }
  .range-clear {
    display: none; padding: 5px 12px; border-radius: 999px; border: 1px solid #fecaca;
    background: #fef2f2; color: var(--danger); font-size: 12px; cursor: pointer; font-weight: 600;
    transition: all 0.15s;
  }
  .range-clear.visible { display: inline-block; }
  .range-clear:hover { background: #fee2e2; }
  .filter-info { font-size: 12px; color: var(--text-muted); }
  .tab-badge {
    display: inline-block;
    background: rgba(255,255,255,0.25);
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 11px;
    margin-left: 4px;
  }
  .tab.active .tab-badge { background: rgba(255,255,255,0.25); }
  .tab:not(.active) .tab-badge { background: #e5e7eb; color: var(--text-secondary); }
  .tab-icon { display: inline-flex; flex-shrink: 0; }
  .tab-icon svg { width: 19px; height: 19px; display: block; border-radius: 4px; }

  /* KPI Cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s;
  }
  .kpi-card:hover { box-shadow: var(--shadow-md); }
  .kpi-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .kpi-value {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    min-height: 32px;
  }
  .kpi-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  /* Skeleton loading */
  .skeleton {
    background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skeleton-text { height: 14px; width: 60%; margin-bottom: 8px; }
  .skeleton-value { height: 28px; width: 70%; }
  .kpi-spend .kpi-value { color: var(--primary); }
  .kpi-impressions .kpi-value { color: #7c3aed; }
  .kpi-clicks .kpi-value { color: var(--success); }
  .kpi-ctr .kpi-value { color: var(--warning); }
  .kpi-leads .kpi-value { color: #0891b2; }
  .kpi-cpl .kpi-value { color: var(--danger); }

  /* Charts */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  .chart-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .chart-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
  }
  .chart-wrap { position: relative; height: 260px; }
  .chart-wrap canvas { width: 100% !important; }

  /* Content Summary */
  .content-section {
    margin-bottom: 24px;
  }
  .content-section-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
  }
  .platform-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .platform-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .platform-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .platform-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    overflow: hidden;
  }
  .platform-icon svg { width: 100%; height: 100%; display: block; border-radius: 8px; }
  .platform-icon.xhs { background: #ff2442; color: #fff; }
  .platform-icon.wechat { background: #07c160; color: #fff; }
  .platform-name {
    font-size: 15px;
    font-weight: 600;
  }
  .platform-total {
    margin-left: auto;
    text-align: right;
  }
  .platform-total .count {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .platform-total .label {
    font-size: 11px;
    color: var(--text-muted);
  }
  .content-items {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
  }
  .content-item {
    background: #f8fafc;
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }
  .content-item .type {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .content-item .count {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  /* Monthly spend card */
  .spend-months {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .spend-month .spend-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .spend-month .m-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .spend-month .m-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: 6px;
    font-weight: 400;
  }
  .spend-month .m-val {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }
  .spend-month .bar-track {
    height: 8px;
    background: #f1f5f9;
    border-radius: 4px;
    overflow: hidden;
  }
  .spend-month .bar {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #60a5fa, #2563eb);
    transition: width .4s ease;
  }
  .spend-month .bar.xhs { background: linear-gradient(90deg, #f87171, #ef4444); }
  .spend-month .bar.wechat { background: linear-gradient(90deg, #34d399, #10b981); }

  /* Table */
  .table-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .table-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .table-header h3 { font-size: 15px; font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    background: #f8fafc;
    padding: 11px 14px;
    text-align: right;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    font-size: 12px;
    letter-spacing: 0.3px;
  }
  thead th:first-child { text-align: left; }
  tbody td {
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td:first-child { text-align: left; font-weight: 500; color: var(--text-secondary); }
  tbody tr:hover { background: #f8fafc; }
  .totals-row {
    font-weight: 700;
    background: #f0f9ff !important;
  }
  .totals-row td {
    border-top: 2px solid #93c5fd;
    color: var(--primary);
  }
  .totals-row td:first-child { color: var(--primary); }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 64px 24px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--text-secondary); }
  .empty-state p { font-size: 13px; }

  /* Loading */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 240px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 16px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .header { padding: 16px 20px; }
    .header-meta { display: none; }
    .container { padding: 16px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .charts-row { grid-template-columns: 1fr; }
    .platform-grid { grid-template-columns: 1fr; }
    table { font-size: 12px; }
    thead th, tbody td { padding: 8px 10px; }
  }
</style>
</head>

// Convert CNY value to CHF
function toCHF(cny) {
  if (cny == null || cny === 0) return cny;
  return cny / CHF_RATE;
}

function fmt(n, decimals) {
  if (n == null || n === 0) return '--';
  if (typeof n === 'number') return n.toLocaleString('en-US', { minimumFractionDigits: decimals || 0, maximumFractionDigits: decimals || 0 });
  return n;
}

function fmtCHF(n) {
  if (n == null) return '--';
  return 'CHF ' + toCHF(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtPct(n, decimals) {
  if (n == null) return '--';
  return (n * 100).toFixed(decimals || 2) + '%';
}

function fmtCost(n) {
  if (n == null || n === 0) return '--';
  return 'CHF ' + toCHF(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function getMetricNames() {

  try {
    var resp = await fetch('data.json?_=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var text = await resp.text();
    if (!text || text.trim().length === 0) throw new Error('data.json is empty');
    allData = JSON.parse(text);
    document.getElementById('last-update').textContent = allData.project.lastUpdate || '--';
    var periodTxt = String(allData.project.period || '--').replace('截至', 'As of ');
    document.getElementById('header-period').textContent = 'Data Period: ' + periodTxt;
    updateBadges();
    // global max date across platforms (for quick range cutoffs)
    var dates = [];
    ['wechat', 'xiaohongshu'].forEach(function (p) {
      (allData[p].daily || []).forEach(function (row) { dates.push(row.date); });
    });
    dates.sort();
    globalMaxDate = dates.length ? dates[dates.length - 1] : null;
    // dynamic date-picker bounds derived from actual data range
    if (dates.length) {
      DATE_MIN = dates[0];
      DATE_MAX = globalMaxDate;
      ['date-start', 'date-end'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) { el.min = DATE_MIN; el.max = DATE_MAX; }
      });
    }
    renderAll();
  } catch (e) {
    document.getElementById('kpi-cards').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1"><div class="icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg></div><h3>Data Load Failed</h3><p>' + e.message + '</p><p style="font-size:12px;margin-top:4px">Please check that data.json exists and is valid</p></div>';
    document.getElementById('charts-area').innerHTML = '';
    document.getElementById('content-area').innerHTML = '';
    document.getElementById('table-area').innerHTML = '';
    console.error('Load error:', e);
  }
}

function updateBadges() {
  var wcDays = allData.wechat.daily.length;
  var xhsDays = allData.xiaohongshu.daily.length;
  document.getElementById('badge-wechat').textContent = wcDays > 0 ? wcDays + ' days' : 'None';
  document.getElementById('badge-xhs').textContent = xhsDays > 0 ? xhsDays + ' days' : 'None';
}

function getPlatformData() {
  var pd = activePlatform === 'wechat' ? allData.wechat : allData.xiaohongshu;
  var daily = pd.daily || [];
  var filtered = daily;
  var isCustom = false;
  if (customStart || customEnd) {
    isCustom = true;
    filtered = daily.filter(function (d) {
      if (customStart && d.date < customStart) return false;
      if (customEnd && d.date > customEnd) return false;
      return true;
    });
  } else if (activeRange !== 'all' && daily.length) {
    // Cutoff is relative to the ACTIVE platform's latest date (not the global max),
    // so a platform whose data lags behind doesn't return an empty range.
    var pMax = daily.map(function (d) { return d.date; }).sort().pop();
    var cutoff = new Date(pMax);
    cutoff.setDate(cutoff.getDate() - Number(activeRange) + 1);
    filtered = daily.filter(function (d) { return new Date(d.date) >= cutoff; });
  }
  if (filtered === daily && !isCustom) return pd;
  // recompute totals from filtered daily
  var t = { spend: 0, impressions: 0, clicks: 0, leads: 0, visit: 0 };
  filtered.forEach(function (d) {
    t.spend += d.spend || 0;
    t.impressions += d.impressions || 0;
    t.clicks += d.clicks || 0;
    t.leads += d.leads || 0;
    t.visit += d.visit || 0;
  });
  t.ctr = t.impressions > 0 ? t.clicks / t.impressions : 0;
  t.cpm = t.impressions > 0 ? t.spend / t.impressions * 1000 : 0;
  t.cpe = t.clicks > 0 ? t.spend / t.clicks : 0;
  t.cpl = t.leads > 0 ? t.spend / t.leads : 0;
  t.cpuv = t.visit > 0 ? t.spend / t.visit : 0;
  return { totals: t, daily: filtered, metrics: pd.metrics };
}

function renderAll() {
  try { renderKPIs(); } catch(e) { console.error('renderKPIs error:', e); }
  try { renderCharts(); } catch(e) { console.error('renderCharts error:', e); }
  try { renderContent(); } catch(e) { console.error('renderContent error:', e); }
  try { renderTable(); } catch(e) { console.error('renderTable error:', e); }
}

function renderKPIs() {
  var pd = getPlatformData();
  if (!pd.totals || pd.daily.length === 0) {
    var pname = activePlatform === 'wechat' ? 'WeChat' : 'Xiaohongshu';
    document.getElementById('kpi-cards').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1"><div class="icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div><h3>No ' + pname + ' ad data</h3><p>Update data.json and refresh to display</p></div>';
    return;
  }
  var t = pd.totals;
  var m = getMetricNames();
  var cards = [
    { cls: 'kpi-spend',      label: 'Ad Spend',         value: fmtCHF(t.spend),         sub: 'Total ad spend' },
    { cls: 'kpi-impressions', label: 'Impressions',     value: fmt(t.impressions),      sub: 'CPM ' + fmtCHF(t.cpm) },
    { cls: 'kpi-clicks',     label: 'Clicks',           value: fmt(t.clicks),           sub: 'CPE ' + fmtCHF(t.cpe) },
    { cls: 'kpi-ctr',        label: 'CTR',              value: fmtPct(t.ctr),           sub: 'Clicks / Impr.' },
    { cls: 'kpi-leads',      label: m.label5,           value: fmt(t[m.metric5]),       sub: m.sub5 },
    { cls: 'kpi-cpl',        label: m.label6,           value: fmtCost(t[m.metric6]),   sub: m.sub6 },
  ];
  document.getElementById('kpi-cards').innerHTML = cards.map(function(c) {
    return '<div class="kpi-card ' + c.cls + '"><div class="kpi-label">' + c.label + '</div><div class="kpi-value">' + c.value + '</div><div class="kpi-sub">' + c.sub + '</div></div>';
  }).join('');
}

function renderCharts() {
  var pd = getPlatformData();
  if (!pd.totals || pd.daily.length === 0) {
    document.getElementById('charts-area').innerHTML = '';
    return;
  }
  var labels = pd.daily.map(function(d) { return d.date.slice(5); });

  // Destroy old charts
  Object.values(charts).forEach(function(c) { try { c.destroy(); } catch(e){} });
  charts = {};

  var m = getMetricNames();
  document.getElementById('charts-area').innerHTML =
    '<div class="chart-card"><div class="chart-title">Ad Spend & Impressions Trend</div><div class="chart-wrap"><canvas id="chart-spend-imp"></canvas></div></div>' +
    '<div class="chart-card"><div class="chart-title">Clicks & ' + m.label5 + ' Trend</div><div class="chart-wrap"><canvas id="chart-click-lead"></canvas></div></div>';

  if (typeof Chart === 'undefined') {
    document.getElementById('charts-area').innerHTML =
      '<div class="chart-card" style="grid-column:1/-1"><div class="chart-title">Chart Load Failed</div><div style="text-align:center;padding:40px;color:var(--text-muted)">Chart.js not loaded. Check network connection.</div></div>';
    return;
  }

  try {
    // Chart 1: Spend (CHF) + Impressions
    var ctx1 = document.getElementById('chart-spend-imp').getContext('2d');
    charts.c1 = new Chart(ctx1, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Ad Spend (CHF)',
            data: pd.daily.map(function(d) { return toCHF(d.spend); }),
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37,99,235,0.06)',
            fill: true,
            tension: 0.3,
            yAxisID: 'y',
            pointRadius: 3,
            pointHoverRadius: 5,
          },
          {
            label: 'Impressions',
            data: pd.daily.map(function(d) { return d.impressions; }),
            borderColor: '#7c3aed',
            backgroundColor: 'rgba(124,58,237,0.06)',
            fill: true,
            tension: 0.3,
            yAxisID: 'y1',
            pointRadius: 3,
            pointHoverRadius: 5,
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20, font: { size: 12 } } } },
        scales: {
          y: { type: 'linear', position: 'left', title: { display: true, text: 'Spend (CHF)', font: { size: 11 } }, ticks: { font: { size: 10 } }, grid: { color: '#f3f4f6' } },
          y1: { type: 'linear', position: 'right', title: { display: true, text: 'Impressions', font: { size: 11 } }, ticks: { font: { size: 10 } }, grid: { display: false } },
          x: { ticks: { font: { size: 10 } }, grid: { display: false } }
        }
      }
    });

    // Chart 2: Clicks + Revenue metric (Leads/Visits)
    var rm = getRevenueMetric();
    var ctx2 = document.getElementById('chart-click-lead').getContext('2d');
    charts.c2 = new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Clicks',
            data: pd.daily.map(function(d) { return d.clicks; }),
            backgroundColor: '#ef4444',
            borderColor: '#dc2626',
            borderWidth: 1.5,
            borderRadius: 4,
            yAxisID: 'y'
          },
          {
            label: rm.label,
            data: pd.daily.map(function(d) { return d[rm.key]; }),
            backgroundColor: '#2563eb',
            borderColor: '#1d4ed8',
            borderWidth: 1.5,
            borderRadius: 4,
            yAxisID: 'y'
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20, font: { size: 12 } } } },
        scales: {
          y: { title: { display: true, text: 'Count', font: { size: 11 } }, ticks: { font: { size: 10 } }, grid: { color: '#f3f4f6' } },
          x: { ticks: { font: { size: 10 } }, grid: { display: false } }
        }
      }
    });
  } catch(e) {
    console.error('Chart render error:', e);
    document.getElementById('charts-area').innerHTML =
      '<div class="chart-card" style="grid-column:1/-1"><div class="chart-title">Chart Render Failed</div><div style="text-align:center;padding:40px;color:var(--text-muted)">' + e.message + '</div></div>';
  }
}

function renderContent() {
  var contentItems = allData.content || [];
  var platform = activePlatform === 'xiaohongshu' ? '小红书' : '微信';
  var icon = platformIconSVG(activePlatform);
  var cls = activePlatform === 'xiaohongshu' ? 'xhs' : 'wechat';
  var totalLabel = activePlatform === 'xiaohongshu' ? 'Total Notes' : 'Total Content';

  var items = contentItems.filter(function(c) { return c.platform === platform; });

  // Translate content type names
  var typeMap = {
    '专业号内容': 'Official Account',
    '达人内容': 'KOL Content'
  };

  var MONTHS_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function monthLabel(ym) {
    return MONTHS_EN[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(0, 4);
  }

  function buildSpendCard() {
    var pd = getPlatformData();
    var daily = pd.daily || [];
    var totalSpend = (pd.totals && pd.totals.spend) || 0;
    var header =
      '<div class="platform-header">' +
        '<div class="platform-icon ' + cls + '">' + icon + '</div>' +
        '<div class="platform-name">Monthly Spend</div>' +
        '<div class="platform-total"><div class="count">' + fmtCHF(totalSpend) + '</div><div class="label">Total (filtered)</div></div>' +
      '</div>';
    if (daily.length === 0) {
      return '<div class="platform-card">' + header +
        '<div class="empty-state" style="padding:24px"><div class="icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div><h3 style="font-size:14px">No spend data</h3></div>' +
      '</div>';
    }
    var map = {}, order = [];
    daily.forEach(function(d) {
      var ym = d.date.slice(0, 7);
      if (!map[ym]) { map[ym] = { spend: 0, days: 0 }; order.push(ym); }
      map[ym].spend += d.spend || 0;
      map[ym].days += 1;
    });
    order.sort();
    var maxSpend = 0;
    order.forEach(function(ym) { if (map[ym].spend > maxSpend) maxSpend = map[ym].spend; });
    var rows = order.map(function(ym) {
      var v = map[ym].spend;
      var pct = maxSpend > 0 ? (v / maxSpend * 100) : 0;
      var share = totalSpend > 0 ? (v / totalSpend * 100) : 0;
      return '<div class="spend-month">' +
        '<div class="spend-row">' +
          '<span class="m-label">' + monthLabel(ym) + '<span class="m-meta">' + map[ym].days + 'd · ' + share.toFixed(1) + '% of total</span></span>' +
          '<span class="m-val">' + fmtCHF(v) + '</span>' +
        '</div>' +
        '<div class="bar-track"><div class="bar ' + cls + '" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '</div>';
    }).join('');
    return '<div class="platform-card">' + header + '<div class="spend-months">' + rows + '</div></div>';
  }

  if (items.length === 0) {
    document.getElementById('content-area').innerHTML =
      '<div class="content-section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" style="vertical-align:-3px;margin-right:5px"><path d="M12 21s-7-6.1-7-11a7 7 0 1114 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Content Publishing</div>' +
      '<div class="platform-grid">' +
        '<div class="platform-card">' +
          '<div class="platform-header"><div class="platform-icon ' + cls + '">' + icon + '</div><div class="platform-name">' + (activePlatform === 'xiaohongshu' ? 'Xiaohongshu' : 'WeChat') + '</div></div>' +
          '<div class="empty-state" style="padding:24px"><div class="icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div><h3 style="font-size:14px">No content data</h3></div>' +
        '</div>' +
        buildSpendCard() +
      '</div>';
    return;
  }

  var total = items.reduce(function(sum, c) {
    var n = parseFloat(String(c.count).replace(/[^0-9.]/g, ''));
    return sum + (isNaN(n) ? 0 : n);
  }, 0);

  var itemsHTML = items.map(function(c) {
    var displayType = typeMap[c.type] || c.type;
    // Translate count suffix
    var cNum = parseFloat(String(c.count).replace(/[^0-9.]/g, ''));
    var displayCount = c.count.replace('篇', (cNum === 1 ? ' post' : ' posts'));
    return '<div class="content-item"><div class="type">' + displayType + '</div><div class="count">' + displayCount + '</div></div>';
  }).join('');

  document.getElementById('content-area').innerHTML =
    '<div class="content-section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" style="vertical-align:-3px;margin-right:5px"><path d="M12 21s-7-6.1-7-11a7 7 0 1114 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Content Publishing</div>' +
    '<div class="platform-grid">' +
      '<div class="platform-card">' +
        '<div class="platform-header">' +
          '<div class="platform-icon ' + cls + '">' + icon + '</div>' +
          '<div class="platform-name">' + (activePlatform === 'xiaohongshu' ? 'Xiaohongshu' : 'WeChat') + '</div>' +
          '<div class="platform-total"><div class="count">' + total + '</div><div class="label">' + totalLabel + '</div></div>' +
        '</div>' +
        '<div class="content-items">' + itemsHTML + '</div>' +
      '</div>' +
      buildSpendCard() +
    '</div>';
}

function renderTable() {
  var pd = getPlatformData();
  if (!pd.totals || pd.daily.length === 0) {
    var pname = activePlatform === 'wechat' ? 'WeChat' : 'Xiaohongshu';
    document.getElementById('table-area').innerHTML =
      '<div class="empty-state"><div class="icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div><h3>No ' + pname + ' ad data</h3><p>Update data.json and refresh to display</p></div>';
    return;
  }

  var t = pd.totals;
  var m = getMetricNames();

  var rows = pd.daily.map(function(d) {
    return '<tr>' +
      '<td>' + d.date + '</td>' +
      '<td>' + fmtCHF(d.spend) + '</td>' +
      '<td>' + fmt(d.impressions) + '</td>' +
      '<td>' + fmt(d.clicks) + '</td>' +
      '<td>' + fmtPct(d.ctr, 2) + '</td>' +
      '<td>' + fmt(d[m.metric5]) + '</td>' +
      '<td>' + fmtCost(d[m.metric6]) + '</td>' +
      '<td>' + fmtCHF(d.cpm) + '</td>' +
      '<td>' + fmtCHF(d.cpe) + '</td>' +
    '</tr>';
  }).join('');

  var tableHTML = '<div class="table-header">' +
    '<h3><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" style="vertical-align:-3px;margin-right:5px"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>Daily Ad Performance</h3>' +
    '<span style="font-size:12px;color:var(--text-muted)">' + pd.daily.length + ' records</span>' +
  '</div>' +
  '<div class="table-wrap">' +
    '<table>' +
      '<thead>' +
        '<tr>' +
          '<th>Date</th>' +
          '<th>Ad Spend</th>' +
          '<th>Impressions</th>' +
          '<th>Clicks</th>' +
          '<th>CTR</th>' +
          '<th>' + m.label5 + '</th>' +
          '<th>' + m.label6 + '</th>' +
          '<th>CPM</th>' +
          '<th>CPE</th>' +
        '</tr>' +
      '</thead>' +
      '<tbody>' +
        rows +
        '<tr class="totals-row">' +
          '<td>Total</td>' +
          '<td>' + fmtCHF(t.spend) + '</td>' +
          '<td>' + fmt(t.impressions) + '</td>' +
          '<td>' + fmt(t.clicks) + '</td>' +
          '<td>' + fmtPct(t.ctr, 2) + '</td>' +
          '<td>' + fmt(t[m.metric5]) + '</td>' +
          '<td>' + fmtCost(t[m.metric6]) + '</td>' +
          '<td>' + fmtCHF(t.cpm) + '</td>' +
          '<td>' + fmtCHF(t.cpe) + '</td>' +
        '</tr>' +
      '</tbody>' +
    '</table>' +
  '</div>';

  document.getElementById('table-area').innerHTML = tableHTML;
}

// Tab switching
document.getElementById('tabs').addEventListener('click', function(e) {
  var tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  tab.classList.add('active');
  activePlatform = tab.dataset.platform;
  renderAll();
});

// ---------- Date filter events ----------
function updateFilterInfo() {
  var info = document.getElementById('filter-info');
  if (!info) return;
  if (customStart || customEnd) {
    var s = customStart || 'any';
    var e = customEnd || 'any';
    info.textContent = 'Range: ' + s + ' ~ ' + e;
  } else if (activeRange === 'all') {
    info.textContent = '';
  } else {
    info.textContent = 'Last ' + activeRange + ' days';
  }
}
function updateDateFilterUI() {
  var s = document.getElementById('date-start');
  var e = document.getElementById('date-end');
  var clr = document.getElementById('range-clear');
  var has = !!(customStart || customEnd);
  s.classList.toggle('active', !!customStart);
  e.classList.toggle('active', !!customEnd);
  clr.classList.toggle('visible', has);
  document.querySelectorAll('.range-pill').forEach(function (b) {
    b.classList.toggle('active', !has && b.getAttribute('data-range') === activeRange);
  });
  updateFilterInfo();
}
function onDateChange() {
  var s = document.getElementById('date-start');
  var e = document.getElementById('date-end');
  var sv = s.value, ev = e.value;
  if (sv && sv < DATE_MIN) { sv = DATE_MIN; s.value = sv; }
  if (sv && sv > DATE_MAX) { sv = DATE_MAX; s.value = sv; }
  if (ev && ev < DATE_MIN) { ev = DATE_MIN; e.value = ev; }
  if (ev && ev > DATE_MAX) { ev = DATE_MAX; e.value = ev; }
  if (sv && ev && sv > ev) {
    var tmp = sv; sv = ev; ev = tmp;
    s.value = sv; e.value = ev;
  }
  customStart = sv || null;
  customEnd = ev || null;
  updateDateFilterUI();
  renderAll();
}
document.getElementById('date-start').addEventListener('change', onDateChange);
document.getElementById('date-end').addEventListener('change', onDateChange);
document.getElementById('range-clear').addEventListener('click', function () {
  document.getElementById('date-start').value = '';
  document.getElementById('date-end').value = '';
  customStart = null;
  customEnd = null;
  updateDateFilterUI();
  renderAll();
});
document.querySelectorAll('.range-pill').forEach(function (btn) {
  btn.addEventListener('click', function () {
    activeRange = btn.getAttribute('data-range');
    document.getElementById('date-start').value = '';
    document.getElementById('date-end').value = '';
    customStart = null;
    customEnd = null;
    updateDateFilterUI();
    renderAll();
  });
});

// Auto-refresh every 5 minutes
setInterval(loadData, 5 * 60 * 1000);

// Initial load
loadData();
</script>
