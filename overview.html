<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Franke 弗兰卡 · 整体投放概览</title>
<style>
  :root {
    --bg: #f5f6f8; --card-bg: #ffffff; --text: #1a1d23; --text-secondary: #6b7280;
    --text-muted: #9ca3af; --border: #e5e7eb; --primary: #2563eb; --primary-light: #dbeafe;
    --success: #059669; --warning: #d97706; --danger: #dc2626; --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #fff;
    padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .header-brand { display: flex; align-items: center; gap: 14px; }
  .header-title h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header-title p { font-size: 13px; color: #94a3b8; margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .header-meta { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #94a3b8; }
  .header-meta b { color: #e2e8f0; font-weight: 600; }
  .nav-link { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    color: #e2e8f0; padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; transition: all 0.2s; }
  .nav-link:hover { background: rgba(255,255,255,0.18); }
  .lang-switch { display: flex; gap: 4px; }
  .lang-opt { padding: 6px 12px; border-radius: 6px; font-size: 13px; color: #cbd5e1; text-decoration: none; border: 1px solid rgba(255,255,255,0.15); }
  .lang-opt.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 24px 48px; }

  .filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--card-bg);
    border-radius: var(--radius); padding: 12px 18px; margin-bottom: 22px; box-shadow: var(--shadow); }
  .filter-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.5px; }
  .date-input { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px;
    color: var(--text); background: #fff; font-family: inherit; outline: none; color-scheme: light; }
  .date-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .date-sep { font-size: 12px; color: var(--text-secondary); }
  .reset-btn { margin-left: auto; background: #fff; border: 1px solid var(--border); color: var(--text-secondary);
    padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .reset-btn:hover { border-color: var(--primary); color: var(--primary); }

  .section-title { font-size: 15px; font-weight: 700; color: var(--text); margin: 4px 0 14px; display: flex; align-items: center; gap: 8px; }
  .section-title .bar { width: 4px; height: 16px; background: var(--primary); border-radius: 2px; }
  .section-sub { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }

  .pacing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 14px; }
  .pacing-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; border-top: 3px solid var(--primary); }
  .pacing-card.influencer { border-top-color: #7c3aed; }
  .pacing-card.total { border-top-color: #0f172a; }
  .pc-head { display: flex; align-items: baseline; justify-content: space-between; }
  .pc-name { font-size: 15px; font-weight: 700; }
  .pc-en { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .pc-pacing-wrap { margin: 14px 0 6px; }
  .pc-pacing-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .pc-pacing-label { font-size: 12px; color: var(--text-secondary); }
  .pc-pacing-val { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .pc-pacing-val .pct { font-size: 15px; font-weight: 700; color: var(--text-muted); margin-left: 2px; }
  .progress { height: 10px; border-radius: 999px; background: #eef2f7; overflow: hidden; }
  .progress > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), #60a5fa); transition: width 0.4s ease; }
  .pacing-card.influencer .progress > span { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
  .pacing-card.total .progress > span { background: linear-gradient(90deg, #0f172a, #475569); }
  .progress.warn > span { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .progress.over > span { background: linear-gradient(90deg, #dc2626, #f87171); }
  .pc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 16px; }
  .pc-stat .k { font-size: 11px; color: var(--text-muted); }
  .pc-stat .v { font-size: 15px; font-weight: 700; margin-top: 1px; }

  .pacing-note { font-size: 12px; color: var(--text-secondary); background: #f8fafc; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 28px; }
  .pacing-note b { color: var(--text); }

  .plat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 16px; }
  .plat-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
  .plat-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .plat-name { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .plat-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--primary-light); color: var(--primary); font-weight: 600; }
  .plat-tag.wc { background: #dcfce7; color: #15803d; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { background: #f9fafb; border-radius: 8px; padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--text-muted); }
  .stat .v { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .stat .v small { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
  .stat.cum { background: #fff7ed; border: 1px solid #fed7aa; }
  .stat.cum .k { color: #c2410c; }
  .bench { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .bench-title { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
  .bench-title .bar { width: 3px; height: 12px; background: var(--warning); border-radius: 2px; }
  .bench-row { display: flex; align-items: baseline; gap: 8px; font-size: 12px; margin-top: 5px; }
  .bench-row .bk { font-weight: 700; width: 28px; flex: none; }
  .bench-row .bv { font-weight: 700; min-width: 76px; flex: none; }
  .bench-row .br { color: var(--text-muted); flex: 1; }
  .badge { flex: none; font-size: 10px; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
  .badge.ok { background: #dcfce7; color: #15803d; }
  .badge.out { background: #fee2e2; color: #b91c1c; }
  .lead-note { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--text-muted); }
  .footer { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 36px; }
  @media (max-width: 560px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } .plat-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="header">
    <div class="header-brand">
      <div class="header-title">
        <h1>Franke 弗兰卡 · 整体投放概览</h1>
        <p id="header-sub">瑞士弗兰卡 Franke × WSD微思敦</p>
      </div>
    </div>
    <div class="header-right">
      <div class="header-meta">
        <span>周期：<b id="meta-period">—</b></span>
        <span>更新：<b id="meta-update">—</b></span>
      </div>
      <a class="nav-link" href="index.html">查看分平台明细 →</a>
      <div class="lang-switch">
        <a class="lang-opt active" href="overview.html">中文</a>
        <a class="lang-opt" href="overview-en.html">EN</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="filter-bar">
      <span class="filter-label">时间筛选</span>
      <input type="date" id="start-date" class="date-input" min="2026-06-01" max="2026-09-30" value="2026-06-01">
      <span class="date-sep">至</span>
      <input type="date" id="end-date" class="date-input" min="2026-06-01" max="2026-09-30" value="2026-09-30">
      <span class="filter-label" id="filter-range" style="margin-left:4px;"></span>
      <button class="reset-btn" id="reset-btn">重置为全周期</button>
    </div>

    <div class="section-title"><span class="bar"></span>整体消耗与 Pacing
      <span class="section-sub">全平台汇总口径 · 实际消耗 / 总预算执行进度</span></div>
    <div class="pacing-grid" id="pacing-grid"></div>
    <div class="pacing-note" id="pacing-note"></div>

    <div class="section-title"><span class="bar"></span>各平台基础数据
      <span class="section-sub">随上方时间筛选联动 · 含 Benchmark 基准</span></div>
    <div class="plat-grid" id="plat-grid"></div>

    <div class="footer">数据来源：Franke × WSD微思敦 项目 DashBoard · 整体概览版（人民币 CNY）</div>
  </div>

<script>
var CHF_RATE = 0; // 中文版用人民币，不做换算
function fmtMoney(v) {
  v = Number(v) || 0;
  return '¥' + v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtInt(v) {
  v = Number(v) || 0;
  if (v >= 10000) return (v / 10000).toFixed(1) + '万';
  return Math.round(v).toLocaleString('zh-CN');
}
function pacingClass(p) { if (p >= 1) return 'over'; if (p >= 0.85) return 'warn'; return ''; }

var BENCH = {
  xiaohongshu: { ctr: [0.0702, 0.0908], cpl: [340, 405] },
  wechat:       { ctr: [0.01, 0.015],    cpl: [180, 250] }
};
var BENCH_TITLE = '基准 Benchmark', BENCH_OK = '达标', BENCH_OUT = '未达标';
function benchRow(label, actualStr, actualVal, lo, hi) {
  var ok = actualVal >= lo && actualVal <= hi;
  var rangeStr = label === 'CTR' ? ((lo*100).toFixed(2) + '%–' + (hi*100).toFixed(2) + '%') : (fmtMoney(lo) + '–' + fmtMoney(hi));
  return '<div class="bench-row"><span class="bk">' + label + '</span>'
    + '<span class="bv">' + actualStr + '</span>'
    + '<span class="br">基准 ' + rangeStr + '</span>'
    + '<span class="badge ' + (ok ? 'ok' : 'out') + '">' + (ok ? BENCH_OK : BENCH_OUT) + '</span></div>';
}
function renderBench(platform, ctrActual, cplActual) {
  var b = BENCH[platform];
  return '<div class="bench"><div class="bench-title">' + BENCH_TITLE + '</div>'
    + benchRow('CTR', (ctrActual*100).toFixed(2) + '%', ctrActual, b.ctr[0], b.ctr[1])
    + benchRow('CPL', fmtMoney(cplActual), cplActual, b.cpl[0], b.cpl[1])
    + '</div>';
}

var overallMeta = [
  { key: 'digitalPaidMedia', name: '数字广告投放', en: 'Digital Paid Media', cls: '' },
  { key: 'influencer',       name: '达人营销',     en: 'Influencer Marketing', cls: 'influencer' },
  { key: 'total',            name: '合计',         en: 'Total', cls: 'total' },
];
var DATE_MIN = '2026-06-01', DATE_MAX = '2026-09-30';
var DATA = null;

function getPred() {
  var s = document.getElementById('start-date').value || DATE_MIN;
  var e = document.getElementById('end-date').value || DATE_MAX;
  return function(d) { return d.date >= s && d.date <= e; };
}
function periodDigitalAdSpend(pred) {
  var s = 0;
  ['xiaohongshu', 'wechat'].forEach(function(p) {
    (DATA[p].daily || []).forEach(function(d) { if (pred(d)) s += d.spend || 0; });
  });
  return s;
}
function periodKolSpend(pred) {
  var s = 0;
  ['xiaohongshu', 'wechat'].forEach(function(p) {
    var k = DATA.kol && DATA.kol[p]; if (!k) return;
    (k.entries || []).forEach(function(e) { if (pred(e)) s += e.price || 0; });
  });
  return s;
}
function periodActual(section, pred) {
  if (section === 'digitalPaidMedia') return periodDigitalAdSpend(pred);
  if (section === 'influencer') return periodKolSpend(pred);
  return periodDigitalAdSpend(pred) + periodKolSpend(pred);
}
function buildSection(section, pred) {
  var budget = (DATA.overall[section] || {}).budget || 0;
  var actual = periodActual(section, pred);
  var fee = Math.round(actual * 0.05 * 100) / 100;
  var subtotal = Math.round((actual + fee) * 100) / 100;
  var pacing = budget > 0 ? actual / budget : 0;
  return { actual: actual, fee: fee, subtotal: subtotal, budget: budget, pacing: pacing };
}

function renderPacing() {
  var pred = getPred();
  var grid = document.getElementById('pacing-grid');
  grid.innerHTML = overallMeta.map(function(m) {
    var d = buildSection(m.key, pred);
    var pct = d.pacing * 100;
    var pc = pacingClass(d.pacing);
    return ''
      + '<div class="pacing-card ' + m.cls + '">'
      +   '<div class="pc-head"><span class="pc-name">' + m.name + '</span><span class="pc-en">' + m.en + '</span></div>'
      +   '<div class="pc-pacing-wrap">'
      +     '<div class="pc-pacing-top"><span class="pc-pacing-label">Pacing（实际 / 预算）</span>'
      +       '<span class="pc-pacing-val">' + pct.toFixed(1) + '<span class="pct">%</span></span></div>'
      +     '<div class="progress ' + pc + '"><span style="width:' + Math.min(pct, 100) + '%"></span></div>'
      +   '</div>'
      +   '<div class="pc-stats">'
      +     '<div class="pc-stat"><div class="k">实际消耗 Actual</div><div class="v">' + fmtMoney(d.actual) + '</div></div>'
      +     '<div class="pc-stat"><div class="k">总预算 Budget</div><div class="v">' + fmtMoney(d.budget) + '</div></div>'
      +     '<div class="pc-stat"><div class="k">服务费 5% Fee</div><div class="v">' + fmtMoney(d.fee) + '</div></div>'
      +     '<div class="pc-stat"><div class="k">含费合计 Sub Total</div><div class="v">' + fmtMoney(d.subtotal) + '</div></div>'
      +   '</div></div>';
  }).join('');

  var tot = buildSection('total', pred);
  var note = document.getElementById('pacing-note');
  note.innerHTML = '说明：Pacing = 实际消耗 ÷ 总预算。当前筛选期整体已消耗 <b>' + fmtMoney(tot.actual)
    + '</b>（含 5% 服务费合计 <b>' + fmtMoney(tot.subtotal) + '</b>），占总预算 <b>' + (tot.pacing*100).toFixed(1)
    + '%</b>。数字广告投放与达人营销分别按各自预算独立核算。';
}

function platformTotals(pd, pred) {
  var t = { spend: 0, impressions: 0, clicks: 0, visit: 0, interaction: 0, leads: 0, orders: 0, roi: 0 };
  (pd.daily || []).forEach(function(d) {
    if (!pred(d)) return;
    for (var k in t) t[k] += (d[k] || 0);
  });
  var imp = t.impressions, clk = t.clicks, sp = t.spend;
  t.ctr = imp > 0 ? clk / imp : 0;
  t.cpm = imp > 0 ? sp / imp * 1000 : 0;
  t.cpe = clk > 0 ? sp / clk : 0;
  t.cpuv = t.visit > 0 ? sp / t.visit : 0;
  t.cpl = t.leads > 0 ? sp / t.leads : 0;
  return t;
}
function stat(k, v) { return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }
function statCum(k, v) { return '<div class="stat cum"><div class="k">' + k + '（累计）</div><div class="v">' + v + '</div></div>'; }

// 平台模块总费用 = 达人采买 + 广告投放(含官方号OA)，与「分平台明细页」口径一致
function kolSpendInPeriod(platform, pred) {
  var k = DATA.kol && DATA.kol[platform];
  if (!k || !k.entries) return 0;
  var s = 0;
  k.entries.forEach(function(e) { if (pred(e)) s += e.price || 0; });
  return s;
}

function renderPlatforms() {
  var pred = getPred();
  var xhs = DATA.xiaohongshu, wc = DATA.wechat;
  var xt = platformTotals(xhs, pred), wt = platformTotals(wc, pred);
  var lg = xhs.leadGen || { count: 0, spend: 0, cost: 0 };
  var daysX = (xhs.daily || []).filter(pred).length, daysW = (wc.daily || []).filter(pred).length;

  var xhsKol = kolSpendInPeriod('xiaohongshu', pred);
  var wcKol  = kolSpendInPeriod('wechat', pred);

  var xhsStats = stat('总费用', fmtMoney(xt.spend + xhsKol))
    + stat('广告投放', fmtMoney(xt.spend)) + stat('达人采买', fmtMoney(xhsKol))
    + stat('曝光', fmtInt(xt.impressions)) + stat('点击', fmtInt(xt.clicks))
    + stat('CTR', (xt.ctr*100).toFixed(2) + '%') + stat('CPM', '¥' + xt.cpm.toFixed(2))
    + stat('进店量', fmtInt(xt.visit)) + stat('互动量', fmtInt(xt.interaction));

  var wcStats = stat('总费用', fmtMoney(wt.spend + wcKol))
    + stat('广告投放', fmtMoney(wt.spend)) + stat('达人采买', fmtMoney(wcKol))
    + stat('曝光', fmtInt(wt.impressions)) + stat('点击', fmtInt(wt.clicks))
    + stat('CTR', (wt.ctr*100).toFixed(2) + '%') + stat('CPM', '¥' + wt.cpm.toFixed(2))
    + stat('Leads', fmtInt(wt.leads)) + stat('CPL', '¥' + wt.cpl.toFixed(2));

  var leadNoteX = '<div class="lead-note">留资（累计）：' + lg.count + ' 条 · 成本 ' + fmtMoney(lg.cost) + '</div>';
  var calcNoteX = '<div class="lead-note">口径：达人采买 + 广告投放（含官号OA）</div>';
  var calcNoteW = '<div class="lead-note">口径：达人采买 + 广告投放（表单留资 + 京东到店）</div>';

  document.getElementById('plat-grid').innerHTML =
    '<div class="plat-card"><div class="plat-head"><span class="plat-name">小红书 <span class="plat-tag">XHS</span></span>'
      + '<span class="pc-en">投放 ' + daysX + ' 天</span></div><div class="stat-grid">' + xhsStats + '</div>'
      + renderBench('xiaohongshu', xt.ctr, lg.cost) + leadNoteX + calcNoteX + '</div>'
    + '<div class="plat-card"><div class="plat-head"><span class="plat-name">微信 <span class="plat-tag wc">WC</span></span>'
      + '<span class="pc-en">投放 ' + daysW + ' 天</span></div><div class="stat-grid">' + wcStats + '</div>'
      + renderBench('wechat', wt.ctr, wt.cpl) + calcNoteW + '</div>';
}

function updateRangeLabel() {
  var s = document.getElementById('start-date').value || DATE_MIN;
  var e = document.getElementById('end-date').value || DATE_MAX;
  document.getElementById('filter-range').textContent = s + ' ~ ' + e;
}
function renderAll() { updateRangeLabel(); renderPacing(); renderPlatforms(); }

function init(all) {
  DATA = all;
  document.getElementById('meta-period').textContent = (all.project && all.project.period) || '—';
  document.getElementById('meta-update').textContent = (all.project && all.project.lastUpdate) || '—';
  renderAll();
}
['start-date', 'end-date'].forEach(function(id) {
  document.getElementById(id).addEventListener('change', renderAll);
});
document.getElementById('reset-btn').addEventListener('click', function() {
  document.getElementById('start-date').value = DATE_MIN;
  document.getElementById('end-date').value = DATE_MAX;
  renderAll();
});

fetch('data.json')
  .then(function(r) { return r.json(); })
  .then(function(all) { init(all); })
  .catch(function(e) {
    document.getElementById('pacing-grid').innerHTML = '<div style="color:#dc2626">数据加载失败，请确认通过 http 访问（GitHub Pages 或本地服务器）。</div>';
    console.error(e);
  });
</script>
</body>
</html>
